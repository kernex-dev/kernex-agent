name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Dry-run entry point: builds, checksums, and attests the standalone
  # binaries WITHOUT pushing a Docker image or creating a GitHub Release.
  # Used to verify the artifact signing chain against real artifacts.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo fmt --check

  # Scan Rust dependencies and the repo filesystem for known CVEs.
  # Blocks release on CRITICAL or HIGH severity findings that have a fix available.
  security:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  binaries:
    name: Standalone Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [ci, security]
    permissions:
      contents: read
      # Required for sigstore keyless signing of the artifacts
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then ref="${GITHUB_SHA::7}"; fi
          name="kx-${ref}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/kx" "dist/${name}/kx"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          echo "TARBALL=dist/${name}.tar.gz" >> "$GITHUB_ENV"

      # Sigstore keyless signing via the GitHub OIDC identity, matching the
      # Docker image's SLSA provenance pattern. Verify with:
      #   gh attestation verify <tarball> --repo kernex-dev/kernex-agent
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ env.TARBALL }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kx-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  checksums:
    name: Assemble SHA256SUMS
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Compute SHA256SUMS
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # Tag pushes only: a workflow_dispatch dry run stops at artifacts.
    if: github.ref_type == 'tag'
    needs: [binaries, checksums]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  # Publish the crate so `cargo install kernex-agent` matches the tag.
  # crates.io accepts trusted publishing only for this crate: the token is
  # minted from this job's OIDC identity and lives for the job. The
  # trusted-publisher entry on crates.io must name this workflow file and
  # the `release` environment, and that environment should require a
  # reviewer and allow only `v*.*.*` tags.
  crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Tag pushes only: a workflow_dispatch dry run must not publish.
    if: github.ref_type == 'tag'
    needs: [ci, security, binaries]
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      # Required for the OIDC token exchange with crates.io
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Check the tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Skip if this version is already on crates.io
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -A 'kernex-agent-release' \
            "https://crates.io/api/v1/crates/kernex-agent/${VERSION}")"
          if [ "${code}" = "200" ]; then
            echo "kernex-agent ${VERSION} is already published; nothing to do."
            echo "ALREADY_PUBLISHED=1" >> "$GITHUB_ENV"
          fi

      # Build and verify the package before any credential exists, so a
      # dependency's build script never runs next to the registry token.
      - name: Package and verify
        if: env.ALREADY_PUBLISHED != '1'
        run: cargo package --locked

      - name: Mint crates.io OIDC token
        if: env.ALREADY_PUBLISHED != '1'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: env.ALREADY_PUBLISHED != '1'
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  docker:
    name: Build and Push
    runs-on: ubuntu-latest
    # Tag pushes only: a workflow_dispatch dry run must not push images.
    if: github.ref_type == 'tag'
    needs: [ci, security]
    permissions:
      contents: read
      packages: write
      # Required for SLSA provenance attestation
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Generate SLSA provenance and SBOM attestations.
          # Stored in GHCR alongside the image — verifiable with: cosign verify-attestation
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
