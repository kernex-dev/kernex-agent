# Local deployment — Mac Mini, home server, or LAN machine.
# No TLS. Access at http://localhost:8080
#
# The port is published on 127.0.0.1 only. To reach kx from other machines on
# the LAN, set KX_BIND=0.0.0.0 in .env. This file serves plain http, so the
# bearer token then crosses the network unencrypted.
#
# Usage:
#   cp .env.example .env   # fill in KERNEX_AUTH_TOKEN and one provider key
#   docker compose -f docker-compose.local.yml up -d

networks:
  kx_net:
    driver: bridge

volumes:
  kx_data:  # persistent job data, skills, and workflows

services:
  kx:
    # Pinned to a release. To upgrade, set KX_VERSION in .env, then pull and restart.
    image: ghcr.io/kernex-dev/kernex-agent:${KX_VERSION:-0.11.1}
    networks:
      - kx_net
    ports:
      - "${KX_BIND:-127.0.0.1}:8080:8080"
    env_file: .env
    # ── Provider selection ───────────────────────────────────────────────────────
    # Put one provider's key in .env. Without KERNEX_PROVIDER, kx uses the
    # first key it finds in the order below, then an Ollama that answers at
    # OLLAMA_HOST, and logs which one it picked. Set KERNEX_PROVIDER to pick one.
    # The image has no Claude or OpenCode CLI, so claude-code and opencode do
    # not run in it.
    #   anthropic   ->  ANTHROPIC_API_KEY
    #   openai      ->  OPENAI_API_KEY
    #   gemini      ->  GEMINI_API_KEY
    #   openrouter  ->  OPENROUTER_API_KEY  (routes to many models via one key)
    #   groq        ->  GROQ_API_KEY        (fast, low-cost)
    #   mistral     ->  MISTRAL_API_KEY
    #   deepseek    ->  DEEPSEEK_API_KEY    (very low-cost)
    #   fireworks   ->  FIREWORKS_API_KEY
    #   xai         ->  XAI_API_KEY
    #   ollama      ->  OLLAMA_HOST=host.docker.internal:11434 (no key; on Linux
    #                   also add extra_hosts: ["host.docker.internal:host-gateway"])
    # KERNEX_API_KEY works for any provider, but only with KERNEX_PROVIDER set.
    environment:
      KERNEX_PROVIDER: ${KERNEX_PROVIDER:-}
      KERNEX_MODEL: ${KERNEX_MODEL:-}
      KERNEX_API_KEY: ${KERNEX_API_KEY:-}
      KERNEX_BASE_URL: ${KERNEX_BASE_URL:-}
    command:
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --workers
      - "${KX_WORKERS:-4}"
    volumes:
      # Persistent data directory — skills and workflows are bootstrapped here on first run
      - kx_data:/home/kx/.kx
      # Optional: override bundled skills with your own directory
      # - type: bind
      #   source: ./my-skills
      #   target: /home/kx/.kx/skills
      #   read_only: true
      # Optional: override bundled workflows with your own directory
      # - type: bind
      #   source: ./my-workflows
      #   target: /home/kx/.kx/workflows
      #   read_only: true
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "2.0"
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
