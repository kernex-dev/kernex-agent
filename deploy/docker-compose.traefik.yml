# VPS deployment for servers that already run Traefik as a reverse proxy.
# Caddy is NOT included — kx binds to a localhost port and Traefik routes to it.
#
# Prerequisites:
#   - Traefik v2 or v3 already running
#   - A Traefik network configured to discover containers (set TRAEFIK_NETWORK in .env)
#   - One provider's API key in .env
#
# Usage:
#   cp .env.example .env   # set KERNEX_AUTH_TOKEN, KERNEX_PROVIDER, API key, DOMAIN
#   docker compose -f docker-compose.traefik.yml up -d
#
# Traefik will route https://<DOMAIN> to kx:8080 via the shared network.
# kx is also accessible locally at http://127.0.0.1:<KX_PORT> (default 8081) for
# health checks or WireGuard VPN access without going through Traefik.

networks:
  kx_net:
    driver: bridge
  traefik_net:
    # The name of your existing Traefik network. Common values: traefik, proxy, web
    # Set TRAEFIK_NETWORK in .env to match your setup.
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true

volumes:
  kx_data:  # persistent job data, skills, and workflows

services:

  # ── kx serve ────────────────────────────────────────────────────────────────
  kx:
    # Pinned to a release. To upgrade, set KX_VERSION in .env, then pull and restart.
    image: ghcr.io/kernex-dev/kernex-agent:${KX_VERSION:-0.10.0}
    container_name: kx
    networks:
      - kx_net
      - traefik_net
    ports:
      # Localhost-only binding for direct access (VPN, health checks)
      - "127.0.0.1:${KX_PORT:-8081}:8080"
    env_file: .env
    # ── Provider selection ───────────────────────────────────────────────────────
    # Put one provider's key in .env. Without KERNEX_PROVIDER, kx uses the
    # first key it finds in the order below, then an Ollama that answers at
    # OLLAMA_HOST, and logs which one it picked. Set KERNEX_PROVIDER to pick one.
    # The image has no Claude or OpenCode CLI, so claude-code and opencode do
    # not run in it.
    #   anthropic   ->  ANTHROPIC_API_KEY
    #   openai      ->  OPENAI_API_KEY
    #   gemini      ->  GEMINI_API_KEY
    #   openrouter  ->  OPENROUTER_API_KEY  (routes to many models via one key)
    #   groq        ->  GROQ_API_KEY        (fast, low-cost)
    #   mistral     ->  MISTRAL_API_KEY
    #   deepseek    ->  DEEPSEEK_API_KEY    (very low-cost)
    #   fireworks   ->  FIREWORKS_API_KEY
    #   xai         ->  XAI_API_KEY
    #   ollama      ->  OLLAMA_HOST=host.docker.internal:11434 (no key; on Linux
    #                   also add extra_hosts: ["host.docker.internal:host-gateway"])
    # For OpenAI-compatible proxies (e.g. LiteLLM), also set KERNEX_BASE_URL.
    environment:
      KERNEX_PROVIDER: ${KERNEX_PROVIDER:-}
      KERNEX_MODEL: ${KERNEX_MODEL:-}
      KERNEX_API_KEY: ${KERNEX_API_KEY:-}
      KERNEX_BASE_URL: ${KERNEX_BASE_URL:-}
    command:
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --workers
      - "${KX_WORKERS:-4}"
    volumes:
      - kx_data:/home/kx/.kx
      # Optional: override bundled skills with your own directory
      # - type: bind
      #   source: ./my-skills
      #   target: /home/kx/.kx/skills
      #   read_only: true
    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kx.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.kx.entrypoints=websecure"
      - "traefik.http.routers.kx.tls=true"
      - "traefik.http.routers.kx.tls.certresolver=letsencrypt"
      - "traefik.http.services.kx.loadbalancer.server.port=8080"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "2.0"
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
